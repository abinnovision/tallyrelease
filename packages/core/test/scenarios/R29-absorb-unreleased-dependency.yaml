description: >-
  A released unit absorbs Changes of unreleased dependencies, directly or
  through other unreleased units; Release-As footers are not absorbed.
plugins:
  - name: stub
    units:
      - { id: app, root: apps/app }
      - { id: db, root: packages/db }
      - { id: ui, root: packages/ui }
    edges:
      - { from: db, to: ui, reason: dependencies, pinned: false }
      - { from: ui, to: app, reason: dependencies, pinned: false }
config:
  plugins: { stub: {} }
  units:
    apps/app: { release: true }
  branches:
    - { name: main, line: default, channels: { build: beta } }
git:
  commits:
    - id: c0
      files:
        apps/app/index.ts: "0"
        packages/db/index.ts: "0"
        packages/ui/index.ts: "0"
    - id: c1
      message: "fix: db\n\nRelease-As: 5.0.0"
      files: { packages/db/index.ts: "1" }
    - id: c2
      message: "feat: ui"
      files: { packages/ui/index.ts: "2" }
  tags:
    - { name: app-v1.0.0, commit: c0 }
base: c0
plan: {}
expect:
  plan:
    units:
      - {
          id: db,
          kind: rebuild,
          bump: null,
          next: null,
          absorbedFrom: [],
          changes: [],
        }
      - {
          id: ui,
          kind: rebuild,
          bump: null,
          next: null,
          absorbedFrom: [],
          changes: [],
        }
      - id: app
        affected: { reason: dependent }
        kind: prerelease
        bump: patch
        releaseAs: null
        absorbedFrom: [db, ui]
        next: 1.0.1
        version: 1.0.1-beta.2
        changes:
          - { sha: c2, type: feat, via: ui }
          - { sha: c1, type: fix, via: db }
    warnings:
      - { code: W_RELEASE_AS_IGNORED }
