description: >-
  A feat then a chore on a channel line: the chore commit keeps next and
  raises N, so each commit gets its own prerelease version.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  branches:
    - { name: main, line: default, channels: { build: beta } }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0" }
    - id: c1
      message: "feat: a"
      files: { packages/a/index.ts: "1" }
    - id: c2
      message: "chore: a"
      files: { packages/a/index.ts: "2" }
  tags:
    - { name: a-v1.0.0, commit: c0 }
base: c1
plan: {}
expect:
  plan:
    units:
      - { id: a, kind: prerelease, next: 1.1.0, version: 1.1.0-beta.2 }
    warnings: []
