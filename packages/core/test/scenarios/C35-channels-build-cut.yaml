description: >-
  channels sets a build channel for every push and a cut channel for
  prerelease PRs; the cut is numbered one past the planned commit.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  branches:
    - { name: main, line: default, channels: { build: alpha, cut: beta } }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0" }
    - id: c1
      message: "feat: one"
      files: { packages/a/index.ts: "1" }
    - id: c2
      message: "fix: two"
      files: { packages/a/index.ts: "2" }
  tags:
    - { name: a-v1.0.0, commit: c0 }
base: c0
plan: {}
expect:
  plan:
    line:
      {
        rule: main,
        kind: default,
        channel: alpha,
        cut: beta,
        maxBump: null,
        absolute: null,
      }
    units:
      - id: a
        kind: prerelease
        next: 1.1.0
        version: 1.1.0-alpha.2
        cut: 1.1.0-beta.3
    warnings: []
