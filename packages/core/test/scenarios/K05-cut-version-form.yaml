description: >-
  The previous cut is the highest tag of the exact cut form: 1.3.0-x-beta.4
  and release-please's 1.3.0-rc.1 sort higher but are not cuts on channel
  beta.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  branches:
    - { name: main, line: default, channels: { cut: beta } }
git:
  commits:
    - id: c0
      files: { packages/a/i.ts: "0" }
    - id: c1
      message: "feat: one"
      files: { packages/a/i.ts: "1" }
    - id: c2
      message: "fix: two"
      files: { packages/a/i.ts: "2" }
    - id: c3
      message: "fix: three"
      files: { packages/a/i.ts: "3" }
  tags:
    - { name: a-v1.2.0, commit: c0 }
    - { name: a-v1.3.0-beta.2, commit: c1 }
    - { name: a-v1.3.0-x-beta.4, commit: c2 }
    - { name: a-v1.3.0-rc.1, commit: c2 }
base: c0
plan: {}
release:
  cut: true
expect:
  plan:
    units:
      - { id: a, next: 1.3.0, cut: 1.3.0-beta.4 }
  previousCut: { a: a-v1.3.0-beta.2 }
