description: >-
  Fixed group members with a patch and a minor bump from 1.2.0 both release
  1.3.0 with one prerelease.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
      - { id: b, root: packages/b }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  groups:
    sdk: { units: [a, b] }
  branches:
    - { name: main, line: default, channels: { build: beta } }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0", packages/b/index.ts: "0" }
    - id: c1
      message: "fix: a"
      files: { packages/a/index.ts: "1" }
    - id: c2
      message: "feat: b"
      files: { packages/b/index.ts: "2" }
  tags:
    - { name: a-v1.2.0, commit: c0 }
    - { name: b-v1.2.0, commit: c0 }
base: c0
plan: {}
expect:
  plan:
    units:
      - id: a
        group: sdk
        kind: prerelease
        from: 1.2.0
        bump: minor
        next: 1.3.0
        version: 1.3.0-beta.2
        changes: [{ sha: c1, type: fix }]
      - id: b
        group: sdk
        kind: prerelease
        from: 1.2.0
        bump: minor
        next: 1.3.0
        version: 1.3.0-beta.2
        changes: [{ sha: c2, type: feat }]
    groups:
      - name: sdk
        members: [a, b]
        baseTag: a-v1.2.0
        from: 1.2.0
        bump: minor
        next: 1.3.0
        version: 1.3.0-beta.2
    warnings: []
