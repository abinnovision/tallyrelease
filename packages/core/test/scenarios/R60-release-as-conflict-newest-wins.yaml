description: Different values for one unit across commits; the newest committer date wins.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  branches:
    - { name: main, line: default, channels: { build: beta } }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0" }
    - id: c1
      message: "chore: a\n\nRelease-As: a@2.0.0"
      date: "2024-02-01T00:00:00Z"
      files: { packages/a/index.ts: "1" }
    - id: c2
      message: "chore: a\n\nRelease-As: a@3.0.0"
      date: "2024-03-01T00:00:00Z"
      files: { packages/a/index.ts: "2" }
  tags:
    - { name: a-v1.0.0, commit: c0 }
base: c0
plan: {}
expect:
  plan:
    units:
      - { id: a, releaseAs: 3.0.0, next: 3.0.0 }
    warnings:
      - code: W_RELEASE_AS_CONFLICT
        message: 'unit "a": Release-As "3.0.0" in c2 wins over "2.0.0" in c1'
