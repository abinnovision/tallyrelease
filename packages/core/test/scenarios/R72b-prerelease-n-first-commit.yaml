description: >-
  R72 at the feat commit: first prerelease of 1.1.0.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  branches:
    - { name: main, line: default, channels: { build: beta } }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0" }
    - id: c1
      message: "feat: a"
      files: { packages/a/index.ts: "1" }
    - id: c2
      message: "chore: a"
      files: { packages/a/index.ts: "2" }
  tags:
    - { name: a-v1.0.0, commit: c0 }
head: c1
base: c0
plan: {}
expect:
  plan:
    units:
      - { id: a, kind: prerelease, next: 1.1.0, version: 1.1.0-beta.1 }
    warnings: []
