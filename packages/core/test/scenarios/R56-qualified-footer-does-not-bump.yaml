description: A qualified value sets the named unit without a bump or a change entry for it.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
      - { id: b, root: packages/b }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  branches:
    - { name: main, line: default, channels: { build: beta } }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0", packages/b/index.ts: "0" }
    - id: c1
      message: "feat: a\n\nRelease-As: b@2.0.0"
      files: { packages/a/index.ts: "1" }
  tags:
    - { name: a-v1.0.0, commit: c0 }
    - { name: b-v1.0.0, commit: c0 }
base: c0
plan: { all: true }
expect:
  plan:
    units:
      - id: a
        kind: prerelease
        bump: minor
        releaseAs: null
        next: 1.1.0
        changes: [{ sha: c1, type: feat, subject: a }]
      - id: b
        kind: none
        bump: null
        releaseAs: 2.0.0
        next: 2.0.0
        changes: []
    warnings: []
