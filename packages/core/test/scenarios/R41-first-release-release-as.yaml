description: Release-As sets the first release version.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  branches:
    - { name: main, line: default, channels: { build: beta } }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0" }
    - id: c1
      message: "chore: release\n\nRelease-As: 3.0.0"
      files: { packages/a/index.ts: "1" }
base: c0
plan: {}
expect:
  plan:
    units:
      - id: a
        from: null
        bump: null
        releaseAs: 3.0.0
        next: 3.0.0
        version: 3.0.0-beta.2
    warnings: []
