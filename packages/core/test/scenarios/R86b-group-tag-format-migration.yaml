description: >-
  A group that adopts tagFormat continues from the highest member tag of the
  members' own formats.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
      - { id: b, root: packages/b }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  groups:
    sdk: { units: [a, b], tagFormat: "v{version}" }
  branches:
    - { name: main, line: default }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0", packages/b/index.ts: "0" }
    - id: c1
      message: "feat: a"
      files: { packages/a/index.ts: "1" }
  tags:
    - { name: a-v1.2.0, commit: c0 }
    - { name: b-v1.1.0, commit: c0 }
base: c0
plan: {}
release: {}
expect:
  plan:
    groups:
      - { name: sdk, baseTag: a-v1.2.0, from: 1.2.0, next: 1.3.0 }
    warnings: []
  items:
    - name: sdk
      tags:
        - { id: a, tag: v1.3.0 }
        - { id: b, tag: v1.3.0 }
