description: >-
  A member of a group with releaseTag gets the rendered group tag as its
  release tag; an ungrouped unit keeps its own tag.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
      - { id: b, root: packages/b }
      - { id: c, root: packages/c }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  branches:
    - { name: main, line: default }
  groups:
    sdk: { units: [a, b], releaseTag: "{id}-v{version}" }
git:
  commits:
    - id: c0
      files:
        {
          packages/a/index.ts: "0",
          packages/b/index.ts: "0",
          packages/c/index.ts: "0",
        }
  tags:
    - { name: a-v1.0.0, commit: c0 }
    - { name: b-v1.0.0, commit: c0 }
    - { name: c-v1.0.0, commit: c0 }
base: null
plan: { released: true }
expect:
  plan:
    released:
      - { id: a, tag: a-v1.0.0, releaseTag: sdk-v1.0.0 }
      - { id: b, tag: b-v1.0.0, releaseTag: sdk-v1.0.0 }
      - { id: c, tag: c-v1.0.0, releaseTag: c-v1.0.0 }
