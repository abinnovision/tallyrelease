description: >-
  Without changelogs, a release writes version files and templates only; no
  changelog is written and no change file is consumed.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a, version: file }
    versionFiles:
      a: [packages/a/VERSION]
    changes:
      - units: [a]
        type: feat
        breaking: false
        subject: from a changeset
        files: [.changeset/x.md]
config:
  plugins: { stub: {} }
  defaults: { release: true }
  units:
    packages/a:
      versionFiles:
        - { file: README.md, pattern: "a@{version}" }
  branches:
    - { name: main, line: default }
git:
  commits:
    - id: c0
      files:
        packages/a/i.ts: "0"
        packages/a/VERSION: "1.0.0\n"
        README.md: "uses a@1.0.0\n"
    - id: c1
      files: { .changeset/x.md: "---\na: minor\n---\n" }
  tags:
    - { name: a-v1.0.0, commit: c0 }
base: c0
plan: { all: true }
release:
  files: { changelogs: false }
expect:
  plan:
    units:
      - { id: a, next: 1.1.0 }
  files:
    packages/a/VERSION: "1.1.0\n"
    README.md: "uses a@1.1.0\n"
  paths: [README.md, packages/a/VERSION]
  deletes: []
  fileWarnings: []
