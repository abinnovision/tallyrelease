description: >-
  A stable first release replaces the prerelease sections of earlier cuts, so
  the changelog keeps one section for the release.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  branches:
    - { name: main, line: default, channels: { cut: beta } }
git:
  commits:
    - id: c0
      message: "feat: initial"
      files:
        packages/a/i.ts: "0"
        packages/a/CHANGELOG.md: "# Changelog\n\n## 1.0.0-beta.2 (2026-10-02)\n\n* second\n\n## 1.0.0-beta.1 (2026-10-01)\n\n* first\n"
  tags:
    - { name: a-v1.0.0-beta.1, commit: c0 }
base: null
plan: {}
release:
  files: { date: "2026-11-01" }
expect:
  plan:
    units:
      - { id: a, from: null, next: 1.0.0 }
  paths: [packages/a/CHANGELOG.md]
  files:
    packages/a/CHANGELOG.md: "# Changelog\n\n## 1.0.0 (2026-11-01)\n\n\n### Features\n\n* initial\n"
