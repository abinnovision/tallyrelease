description: >-
  A member without changes releases at the group version with no changes.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
      - { id: b, root: packages/b }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  groups:
    sdk: { units: [a, b] }
  branches:
    - { name: main, line: default, channels: { build: beta } }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0", packages/b/index.ts: "0" }
    - id: c1
      message: "feat: a"
      files: { packages/a/index.ts: "1" }
  tags:
    - { name: a-v1.0.0, commit: c0 }
    - { name: b-v1.0.0, commit: c0 }
base: c0
plan: {}
expect:
  plan:
    units:
      - { id: a, kind: prerelease, next: 1.1.0, version: 1.1.0-beta.1 }
      - id: b
        group: sdk
        affected: { reason: group, via: [a] }
        kind: prerelease
        from: 1.0.0
        bump: minor
        propagatedFrom: []
        next: 1.1.0
        version: 1.1.0-beta.1
        changes: []
    warnings: []
