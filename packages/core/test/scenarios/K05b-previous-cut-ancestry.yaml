description: >-
  On release/1.x the cut channel rc-1 renders and parses with its dash. A
  tag of the cut form on main is off the first-parent chain, a tag of an
  older label is not of the cut form, and without a line base there is no
  lower bound.
branch: release/1.x
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
      - { id: b, root: packages/b }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  branches:
    - { name: main, line: default }
    - name: "release/{major}.x"
      line: maintenance
      channels: { cut: "rc-{major}" }
git:
  commits:
    - id: c0
      files: { packages/a/i.ts: "0", packages/b/i.ts: "0" }
    - id: c1
      message: "feat: a on main"
      files: { packages/a/i.ts: "1" }
    - id: c2
      parents: [c0]
      message: "feat: a and b"
      files: { packages/a/i.ts: "2", packages/b/i.ts: "2" }
    - id: c3
      message: "fix: a and b"
      files: { packages/a/i.ts: "3", packages/b/i.ts: "3" }
  tags:
    - { name: a-v1.2.0, commit: c0 }
    - { name: a-v1.3.0-rc-1.1, commit: c1 }
    - { name: a-v1.3.0-beta.1, commit: c2 }
    - { name: b-v1.0.0-rc-1.2, commit: c2 }
base: c0
plan: {}
release:
  cut: true
expect:
  plan:
    line: { rule: "release/{major}.x", channel: null, cut: rc-1 }
    units:
      - { id: a, next: 1.3.0, lineBaseTag: a-v1.2.0, cut: 1.3.0-rc-1.3 }
      - { id: b, next: 1.0.0, lineBaseTag: null, cut: 1.0.0-rc-1.4 }
  previousCut: { a: null, b: b-v1.0.0-rc-1.2 }
