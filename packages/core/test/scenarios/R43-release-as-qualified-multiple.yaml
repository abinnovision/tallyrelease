description: One commit with two qualified values sets both units.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
      - { id: b, root: packages/b }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  branches:
    - { name: main, line: default, channels: { build: beta } }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0", packages/b/index.ts: "0" }
    - id: c1
      message: "chore: versions\n\nRelease-As: a@2.0.0\nRelease-As: b@1.5.0"
  tags:
    - { name: a-v1.0.0, commit: c0 }
    - { name: b-v1.0.0, commit: c0 }
base: null
plan: {}
expect:
  plan:
    units:
      - { id: a, bump: null, releaseAs: 2.0.0, next: 2.0.0 }
      - { id: b, bump: null, releaseAs: 1.5.0, next: 1.5.0 }
    warnings: []
