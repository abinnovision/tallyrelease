description: >-
  The deprecated channel is an alias of channels.build: the plan equals the
  build channel's and warns W_CHANNEL_DEPRECATED.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  branches:
    - { name: main, line: default, channel: beta }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0" }
    - id: c1
      message: "feat: one"
      files: { packages/a/index.ts: "1" }
  tags:
    - { name: a-v1.0.0, commit: c0 }
base: c0
plan: {}
expect:
  plan:
    line: { rule: main, channel: beta, cut: null }
    units:
      - { id: a, kind: prerelease, version: 1.1.0-beta.1, cut: null }
    warnings:
      - code: W_CHANNEL_DEPRECATED
        message: branch rule "main" uses channel, a deprecated alias of channels.build
