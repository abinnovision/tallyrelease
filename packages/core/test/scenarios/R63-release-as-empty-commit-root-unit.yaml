description: >-
  An empty commit with a plain Release-As releases a root unit (git commit
  --allow-empty), as release-please does.
plugins:
  - name: stub
    units:
      - { id: lib, root: "." }
config:
  plugins: { stub: {} }
  units:
    ".": { release: true }
  branches:
    - { name: main, line: default, channels: { build: beta } }
git:
  commits:
    - id: c0
      files: { src/index.ts: "0" }
    - id: c1
      message: "chore: release 2.0.0\n\nRelease-As: 2.0.0"
  tags:
    - { name: v1.3.0, commit: c0 }
base: c0
plan: { all: true }
expect:
  affected: { units: [] }
  plan:
    units:
      - id: lib
        kind: none
        from: 1.3.0
        bump: null
        releaseAs: 2.0.0
        next: 2.0.0
        changes: [{ sha: c1, type: chore, releaseAs: 2.0.0 }]
    warnings: []
