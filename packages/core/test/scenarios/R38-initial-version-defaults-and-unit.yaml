description: defaults.initialVersion applies; a unit overlay wins.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
      - { id: b, root: packages/b }
config:
  plugins: { stub: {} }
  defaults: { release: true, initialVersion: 0.1.0 }
  units:
    packages/b: { initialVersion: 2.0.0 }
  branches:
    - { name: main, line: default, channels: { build: beta } }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0", packages/b/index.ts: "0" }
    - id: c1
      message: "fix: a and b"
      files: { packages/a/index.ts: "1", packages/b/index.ts: "1" }
base: c0
plan: {}
expect:
  units:
    - { id: a, initialVersion: 0.1.0 }
    - { id: b, initialVersion: 2.0.0 }
  plan:
    units:
      - { id: a, from: null, next: 0.1.0, version: 0.1.0-beta.2 }
      - { id: b, from: null, next: 2.0.0, version: 2.0.0-beta.2 }
    warnings: []
