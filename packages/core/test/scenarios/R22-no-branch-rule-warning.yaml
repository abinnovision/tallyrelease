description: Without a matching rule next is computed, versions are null and a warning is emitted.
branch: feature/x
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  branches:
    - { name: main, line: default, channels: { build: beta } }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0" }
    - id: c1
      message: "feat: a"
      files: { packages/a/index.ts: "1" }
  tags:
    - { name: a-v1.0.0, commit: c0 }
base: c0
plan: {}
expect:
  plan:
    branch: feature/x
    line: null
    units:
      - {
          id: a,
          kind: rebuild,
          from: 1.0.0,
          bump: minor,
          next: 1.1.0,
          version: null,
        }
    warnings:
      - code: W_NO_BRANCH_RULE
        message: 'no branch rule matches "feature/x"; versions are null'
