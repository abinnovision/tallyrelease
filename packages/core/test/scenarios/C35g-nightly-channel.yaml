description: >-
  buildChannel nightly labels the build prerelease with channels.nightly and
  reports it as the line channel.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  branches:
    - name: main
      line: default
      channels: { build: beta, cut: rc, nightly: nightly }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0" }
    - id: c1
      message: "feat: one"
      files: { packages/a/index.ts: "1" }
    - id: c2
      message: "fix: two"
      files: { packages/a/index.ts: "2" }
  tags:
    - { name: a-v1.0.0, commit: c0 }
base: c0
plan: { buildChannel: nightly }
expect:
  plan:
    line: { rule: main, channel: nightly, channelKind: nightly, cut: rc }
    units:
      - id: a
        kind: prerelease
        next: 1.1.0
        version: 1.1.0-nightly.2
        cut: 1.1.0-rc.3
    warnings: []
