description: A group tagFormat whose tags a non-member's tag format parses is an overlap.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
      - { id: b, root: packages/b }
      - { id: c, root: packages/c, tagFormat: "v{version}" }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  groups:
    sdk: { units: [a, b], tagFormat: "v{version}" }
git:
  commits:
    - id: c0
      files:
        {
          packages/a/index.ts: "0",
          packages/b/index.ts: "0",
          packages/c/index.ts: "0",
        }
base: c0
plan: { fails: true }
expect:
  affected: { units: [] }
  planError:
    code: E_TAG_FORMAT_OVERLAP
    details: { group: sdk, format: "v{version}", unit: c }
