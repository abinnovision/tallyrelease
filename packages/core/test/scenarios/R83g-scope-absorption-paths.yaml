description: >-
  In paths mode a commit on an unreleased dependency keeps reaching its
  released dependents, and a scope mapped to the dependency is absorbed too.
plugins:
  - name: stub
    units:
      - { id: db, root: packages/db }
      - { id: server, root: apps/server }
      - { id: web, root: apps/web }
    edges:
      - { from: db, to: server, reason: dependencies, pinned: false }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  units:
    packages/db: { release: false }
  attribution:
    scopes: { api: [web], data: [db] }
  branches:
    - { name: main, line: default }
git:
  commits:
    - id: c0
      files:
        apps/server/index.ts: "0"
        apps/web/index.ts: "0"
        packages/db/index.ts: "0"
    - id: c1
      message: "fix(api): db"
      files: { packages/db/index.ts: "1" }
    - id: c2
      message: "fix(data): readme"
      files: { README.md: "2" }
  tags:
    - { name: server-v1.0.0, commit: c0 }
    - { name: web-v1.0.0, commit: c0 }
base: c0
plan: {}
expect:
  affected:
    units:
      - { id: db, reason: direct }
      - { id: server, reason: dependent, via: [db] }
      - { id: web, reason: direct }
  plan:
    units:
      - { id: db, kind: rebuild, bump: null, changes: [] }
      - id: server
        bump: patch
        next: 1.0.1
        absorbedFrom: [db]
        changes: [{ sha: c2, via: db }, { sha: c1, via: db }]
      - { id: web, bump: patch, next: 1.0.1, changes: [{ sha: c1 }] }
