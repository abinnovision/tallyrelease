description: The prerelease number counts first-parent commits since the line base, whatever they touch.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
      - { id: b, root: packages/b }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  branches:
    - { name: main, line: default, channels: { build: beta } }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0", packages/b/index.ts: "0" }
    - id: c1
      message: "fix: a"
      files: { packages/a/index.ts: "1" }
    - id: c2
      message: "feat: b"
      files: { packages/b/index.ts: "2" }
    - id: c3
      message: "docs: readme"
      files: { README.md: "3" }
  tags:
    - { name: a-v1.0.0, commit: c0 }
    - { name: b-v1.0.0, commit: c0 }
base: c0
plan: {}
expect:
  plan:
    units:
      - { id: a, kind: prerelease, next: 1.0.1, version: 1.0.1-beta.3 }
      - { id: b, kind: prerelease, next: 1.1.0, version: 1.1.0-beta.3 }
    warnings: []
