description: >-
  The deprecated channel may be combined with channels.cut, since it maps to
  the build channel.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  branches:
    - { name: main, line: default, channel: alpha, channels: { cut: beta } }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0" }
    - id: c1
      message: "feat: one"
      files: { packages/a/index.ts: "1" }
  tags:
    - { name: a-v1.0.0, commit: c0 }
base: c0
plan: {}
expect:
  plan:
    line: { rule: main, channel: alpha, cut: beta }
    units:
      - { id: a, version: 1.1.0-alpha.1, cut: 1.1.0-beta.2 }
    warnings:
      - { code: W_CHANNEL_DEPRECATED }
