description: >-
  buildChannel nightly on a rule without channels.nightly keeps the build
  channel.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  branches:
    - { name: main, line: default, channels: { build: beta } }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0" }
    - id: c1
      message: "feat: one"
      files: { packages/a/index.ts: "1" }
  tags:
    - { name: a-v1.0.0, commit: c0 }
base: c0
plan: { buildChannel: nightly }
expect:
  plan:
    line: { rule: main, channel: beta, channelKind: build }
    units:
      - { id: a, version: 1.1.0-beta.1 }
