description: >-
  A change without a sha counts for a cut only when one of its files changed
  since the previous cut: a changeset added before it is not listed again,
  one added after it is.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
    changes:
      - units: [a]
        type: feat
        breaking: false
        subject: from a changeset
        files: [.changeset/x.md]
      - units: [a]
        type: feat
        breaking: false
        subject: from a new changeset
        files: [.changeset/y.md]
config:
  plugins: { stub: {} }
  defaults: { release: true }
  branches:
    - { name: main, line: default, channels: { cut: beta } }
git:
  commits:
    - id: c0
      files: { packages/a/i.ts: "0" }
    - id: c1
      files: { .changeset/x.md: "---\na: minor\n---\n" }
    - id: c2
      message: "chore: release"
      files: { packages/a/CHANGELOG.md: "# Changelog\n" }
    - id: c3
      files: { .changeset/y.md: "---\na: minor\n---\n" }
  tags:
    - { name: a-v1.0.0, commit: c0 }
    - { name: a-v1.1.0-beta.2, commit: c2 }
base: c0
plan: { all: true }
release:
  cut: true
  changelog: { date: "2026-11-01", repoUrl: "https://github.com/o/r" }
expect:
  previousCut: { a: a-v1.1.0-beta.2 }
  cutChangelogs:
    a: "## [1.1.0-beta.4](https://github.com/o/r/compare/a-v1.1.0-beta.2...a-v1.1.0-beta.4) (2026-11-01)\n\n\n### Features\n\n* from a new changeset"
