# yaml-language-server: $schema=./node_modules/@tallyrelease/cli/dist/tallyrelease.schema.json
plugins:
  node: {}
# Dependents get a patch release with their dependencies; new units start at 0.1.0.
defaults:
  propagate: patch
  initialVersion: 0.1.0
units:
  packages/core: { id: core, release: true }
  packages/cli: { id: cli, release: true }
  packages/plugins: { id: plugins, release: true }
# core, cli and plugins always release with one version.
groups:
  tallyrelease: { units: [core, cli, plugins] }
branches:
  - { name: main, line: default, channel: beta }
